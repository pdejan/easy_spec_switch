name: Release

# Publishes a GitHub release whenever the TOC's ## Version changes to a version
# that has no release yet. Can also be run manually from the Actions tab.
on:
  push:
    branches: [main]
    paths: [EasySpecSwitch.toc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version from TOC
        id: version
        run: |
          version=$(sed -n 's/^## Version:[[:space:]]*//p' EasySpecSwitch.toc | tr -d '\r[:space:]')
          if [ -z "$version" ]; then
            echo "::error::No '## Version:' line found in EasySpecSwitch.toc"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Tracked files only, inside an EasySpecSwitch/ folder; .gitattributes
        # keeps repo-only files (.github, .gitignore, ...) out of the archive.
        run: |
          git archive --format=zip --prefix=EasySpecSwitch/ -o "EasySpecSwitch_${VERSION}.zip" HEAD
          unzip -l "EasySpecSwitch_${VERSION}.zip"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" "EasySpecSwitch_${VERSION}.zip" \
            --title "Easy Spec Switch $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
